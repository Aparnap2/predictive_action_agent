[project]
name = "predictive-action"
version = "0.1.0"
description = "Agentic AI SaaS for employee churn risk prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "langgraph>=1.0.0",
    "langchain>=1.2.0",
    "langchain-ollama>=1.0.0",
    "ollama>=0.6.0",
    "prisma>=0.15.0",
    "python-dotenv>=1.2.0",
    "aiofiles>=25.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "mypy>=1.15.0",
    "black>=24.0.0",
]
